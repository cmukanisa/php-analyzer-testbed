name: parity
on: [push, pull_request]
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - run: composer install --no-interaction
      - name: Install mago
        # L'installeur vérifie l'attestation de build du binaire via `gh`,
        # qui exige un jeton dans Actions — sans lui, il refuse d'installer
        # (fail-closed, et c'est le bon comportement).
        env:
          GH_TOKEN: ${{ github.token }}
        run: curl --proto '=https' --tlsv1.2 -sSf https://carthage.software/mago.sh | bash && echo "$HOME/.mago/bin" >> $GITHUB_PATH
      - run: ./run.sh
