name: parity
on: [push, pull_request]
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - run: composer install --no-interaction
      - name: Install mago
        run: curl --proto '=https' --tlsv1.2 -sSf https://carthage.software/mago.sh | bash && echo "$HOME/.mago/bin" >> $GITHUB_PATH
      - run: ./run.sh
